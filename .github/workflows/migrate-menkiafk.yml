name: Migrate MENKIAFK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout source monorepo
        uses: actions/checkout@v4
        with:
          repository: MenkiPlugcore/plugin
          ref: main
          path: source

      - name: Copy MENKIAFK to repository root
        shell: bash
        run: |
          cd target
          git pull --rebase origin main
          cd ..
          cp -a source/plugins/MENKIAFK/. target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to migrate."
            exit 0
          fi
          git commit -m "Migrate MENKIAFK from plugin monorepo [skip ci]"
          git push origin HEAD:main
