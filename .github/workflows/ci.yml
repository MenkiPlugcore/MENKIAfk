name: MENKIAFK CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Maven tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run regression tests
        run: mvn -B -ntp clean test

  build:
    name: Production JAR (Java 21)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build production JAR
        run: mvn -B -ntp -DskipTests clean package

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: MENKIAFK-1.6.0-Universal
          path: target/MENKIAFK-1.6.0-Universal.jar
          if-no-files-found: error
          retention-days: 30
